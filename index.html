const countryName = c => c==='cn'?'中国':'日本';


const STORAGE_KEY='fieldnotes-prototype-v1';
const initial=()=>({visits:{...defaultVisits},colors:{},posts:structuredClone(seedPosts)});
function loadState(storage=globalThis.localStorage){
 try { const data=JSON.parse(storage.getItem(STORAGE_KEY)); if(data&&Array.isArray(data.posts)&&data.visits) return {...initial(),...data}; } catch{}
 return initial();
}
function saveState(state,storage=globalThis.localStorage){storage.setItem(STORAGE_KEY,JSON.stringify(state));}
function publishedPosts(state){return state.posts.filter(p=>p.status==='published').sort((a,b)=>b.date.localeCompare(a.date));}
function regionPosts(state,id){return publishedPosts(state).filter(p=>p.regions.includes(id));}
function visitStats(state,country){const items=regions.filter(r=>!country||r.country===country);return {total:items.length,been:items.filter(r=>['visited','lived'].includes(state.visits[r.id])).length,wish:items.filter(r=>state.visits[r.id]==='wish').length};}
function validatePost(post){if(!post.title.trim())return '请为文章写一个标题';if(post.type==='travel'&&!post.regions.length)return '请至少选择一个旅行地区';if(!post.body.some(b=>b.text?.trim()||b.type==='image'))return '请添加正文或照片';return null;}
function validateImport(data){return !!data&&typeof data.visits==='object'&&Array.isArray(data.posts)&&data.posts.every(p=>typeof p.id==='string'&&typeof p.title==='string'&&['draft','published'].includes(p.status)&&['travel','essay'].includes(p.type)&&Array.isArray(p.body)&&Array.isArray(p.regions)&&typeof p.date==='string')&&Object.entries(data.visits).every(([id,status])=>regions.some(r=>r.id===id)&&Object.hasOwn(STATUS,status));}

function sanitizeInline(html){const t=document.createElement('template');t.innerHTML=html||'';function clean(node){if(node.nodeType===Node.TEXT_NODE)return esc(node.textContent);if(node.nodeType!==Node.ELEMENT_NODE)return '';const inner=[...node.childNodes].map(clean).join('');const tag=node.tagName.toLowerCase();if(['strong','b','em','i'].includes(tag))return `<${tag}>${inner}</${tag}>`;if(tag==='br')return '<br>';if(tag==='a'){const url=safeURL(node.getAttribute('href'));return url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${inner}</a>`:inner;}return inner;}return [...t.content.childNodes].map(clean).join('');}

function regionSVG(r,mini=false){const color=colorFor(r.id);return `<g class="region ${isDark(color)?'dark':''} ${mapFilter&&state.visits[r.id]!==mapFilter&&!(mapFilter==='none'&&!state.visits[r.id])?'is-dim':''}" data-region="${r.id}" ${mini?'':`role="link" tabindex="0" aria-label="${esc(r.full)}，${statusFor(r.id).label}，${regionPosts(state,r.id).length} 篇游记"`}><title>${esc(r.full)} · ${statusFor(r.id).label}</title><polygon points="${r.points}" fill="${color}"/>${mini?'':`<text x="${r.x}" y="${r.y}">${esc(r.name)}</text>`}</g>`;}
function mapCard(country){const stats=visitStats(state,country);return `<section class="map-card ${country}" aria-label="${countryName(country)}旅行地图"><div class="map-card-head"><div class="country-label"><h3>${countryName(country)}</h3><span>${country==='cn'?'CHINA':'JAPAN'}</span></div><span class="map-count"><b>${stats.been}</b> / ${stats.total} 已到访</span></div><div class="map-canvas"><svg viewBox="${country==='cn'?'0 0 640 540':'-210 -5 720 560'}" aria-label="${countryName(country)}各地区拼图地图">${country==='jp'?'<rect x="-194" y="275" width="102" height="69" fill="none" stroke="#d1dac6" stroke-dasharray="4 5"/><text class="map-annotation" x="-184" y="266">冲绳 · 附图</text>':''}${regions.filter(r=>r.country===country).map(r=>regionSVG(r)).join('')}</svg></div><div class="map-bottom"><span>点击一块拼图，打开一段旅程 ↗</span><span class="map-coordinate">${country==='cn'?'34 省级地区':'47 都道府县'}</span></div></section>`;}
function atlasSection(full=false){const stats=visitStats(state);return `<section class="atlas-section" id="atlas"><div class="section-heading"><div><div class="eyebrow">A LITTLE FURTHER, A LITTLE CLOSER</div><h2>把走过的地方，慢慢点亮。</h2></div>${full?'<a class="text-link" href="#/admin/maps">管理我的足迹 ↗</a>':'<a href="#/atlas" class="right-note">展开旅行地图 ↗</a>'}</div><div class="atlas-tools"><div class="legend" aria-label="按足迹状态筛选">${Object.entries(STATUS).map(([key,s])=>`<button data-action="filter-map" data-value="${key}" aria-pressed="${mapFilter===key}"><i class="swatch" style="background:${s.color}"></i>${s.label}</button>`).join('')}<button data-action="filter-map" data-value="" aria-pressed="${!mapFilter}">全部</button></div><div class="atlas-options"><label><input type="checkbox" id="show-labels" checked>显示地名</label><span>颜色里，藏着我的旅行记忆</span></div></div><div class="map-grid">${mapCard('cn')}${mapCard('jp')}</div><div class="atlas-summary"><span>已点亮 <b>${stats.been}</b> / ${stats.total} 块拼图 · <b>${stats.wish}</b> 个想去的地方${mapFilter?' · 当前突出：'+STATUS[mapFilter].label:''}</span><span>示意拼图 · 不代表真实边界与面积</span></div></section>`;}
function postCard(p){const location=p.regions.map(id=>regionById(id)?.name).filter(Boolean).join(' · ');return `<a class="post-card" href="#/post/${encodeURIComponent(p.id)}"><div class="post-image"><img src="${esc(safeImage(p.cover))}" alt="${esc(p.title)}封面" loading="lazy"></div><div><div class="post-meta"><span class="category">${p.type==='travel'?'旅行手记':'日常随笔'}</span><span>·</span>${location?`<span>${esc(location)}</span><span>·</span>`:''}<time>${esc(p.date.replaceAll('-','.'))}</time></div><h3>${esc(p.title)}</h3><p>${esc(p.excerpt)}</p><span class="read-more">读一读 <span aria-hidden="true">↗</span></span></div></a>`;}

function atlasPage(){return `<div class="page-head"><div class="eyebrow">MY TRAVEL ATLAS / 旅行足迹</div><h1>世界很大，一块一块走。</h1><p>在中国与日本之间，把经过的城市、想去的远方，拼成自己的旅行地图。点击地区阅读游记，也可以去后台点亮下一块拼图。</p></div>${atlasSection(true)}<section class="directory"><div class="section-heading"><h3>从地名，找到一段记忆。</h3><div class="search-field"><input id="region-search" type="search" placeholder="搜索省份或都道府县…" aria-label="搜索地区"></div></div><div id="directory-results">${directory()}</div></section>`;}
function directory(){const found=regions.filter(r=>(r.full+countryName(r.country)).includes(mapSearch));return ['cn','jp'].map(c=>{const items=found.filter(r=>r.country===c);return items.length?`<p class="tiny-label" style="margin-top:22px">${countryName(c)} / ${items.length} 个地区</p><div class="region-directory">${items.map(r=>`<a class="region-chip" href="#/region/${r.id}"><i class="swatch" style="background:${colorFor(r.id)}"></i>${r.name}<small>${regionPosts(state,r.id).length||'·'}</small></a>`).join('')}</div>`:'';}).join('')||'<div class="empty-state"><h3>没有找到这个地区</h3><p>可以试试“浙江”“东京”或“北海道”。</p></div>';}
function regionPage(id){const r=regionById(id);if(!r)return notFound();const posts=regionPosts(state,id);const coordinates=r.points.split(' ').map(p=>p.split(',').map(Number));const xs=coordinates.map(p=>p[0]),ys=coordinates.map(p=>p[1]);const minX=Math.min(...xs)-12,minY=Math.min(...ys)-12,w=Math.max(...xs)-minX+12,h=Math.max(...ys)-minY+12;return `<div class="page-head"><div class="breadcrumb"><a href="#/atlas">旅行地图</a> / ${countryName(r.country)} / ${r.name}</div><div class="region-hero"><div><div class="eyebrow">${r.country.toUpperCase()} / A PIECE OF MY JOURNEY</div><div class="region-title-line"><h1>${r.name}</h1>${statusPill(id)}</div><p>${r.full} · ${posts.length} 篇旅行手记<br>${posts.length?'地图上的一块颜色，生活里的一段记忆。':'这里的故事还在路上，先为下一次出发留一页空白。'}</p><div class="region-actions"><button class="button" data-action="new-region-post" data-id="${id}">写一篇这里的游记 ↗</button><button class="button secondary" data-action="edit-status" data-id="${id}">编辑足迹与颜色</button></div></div><div class="mini-map"><svg viewBox="${minX} ${minY} ${w} ${h}" aria-hidden="true">${regionSVG(r,true)}</svg></div></div></div><div class="section-heading"><h2>关于${r.name}的手记</h2><span class="right-note">${posts.length} 篇记录</span></div>${posts.length?`<div class="post-grid section-spacer">${posts.map(postCard).join('')}</div>`:`<div class="empty-state"><div class="empty-icon">山</div><h3>故事，从这一页开始。</h3><p>还没有关于${r.name}的文章。记一段路、一个人，或一顿难忘的晚餐。</p><button class="button secondary" data-action="new-region-post" data-id="${id}">写下第一篇游记 ↗</button></div>`}`;}
function articlePage(id,preview=false){const p=state.posts.find(p=>p.id===id&&(p.status==='published'||preview&&session));if(!p)return notFound();return `<article class="article"><div class="breadcrumb muted" style="font-size:11px"><a href="${p.regions.length?'#/region/'+p.regions[0]:'#/essays'}">← ${p.regions.length?regionById(p.regions[0])?.name+'的游记':'所有随笔'}</a></div>${p.status==='draft'?'<div class="notice" style="margin-top:20px">草稿预览 · 尚未公开发布</div>':''}<div class="post-meta" style="margin-top:25px"><span class="category">${p.type==='travel'?'旅行手记':'日常随笔'}</span><span>·</span><time>${esc(p.date)}</time>${p.regions.map(id=>`<a href="#/region/${esc(id)}">${esc(regionById(id)?.name||'')}</a>`).join('')}</div><h1>${esc(p.title)}</h1><p class="muted" style="font-size:13px">${esc(p.excerpt)}</p><img class="article-cover" src="${esc(safeImage(p.cover))}" alt="${esc(p.title)}封面"><div class="article-body">${renderBody(p.body)}</div><div class="article-bottom"><a href="#/essays">← 返回文章列表</a><a href="#/admin/edit/${encodeURIComponent(p.id)}">编辑这篇文章 ↗</a></div></article>`;}
function essayResults(){const posts=publishedPosts(state).filter(p=>(essayFilter==='all'||p.type===essayFilter)&&(p.title+p.excerpt).toLowerCase().includes(listSearch.toLowerCase()));return posts.length?`<div class="post-grid">${posts.map(postCard).join('')}</div>`:'<div class="empty-state"><h3>还没有找到这篇文章</h3><p>换一个关键词，或去后台写下新的故事。</p></div>';}
function essays(){return `<div class="page-head"><div class="eyebrow">NOTES ON LIFE & EVERYTHING ELSE</div><h1>把日子，写成一些文字。</h1><p>旅途中的片刻、研究之外的思考，以及那些不想轻易忘记的小事。</p></div><div class="filter-tabs">${[['all','全部文章'],['essay','日常随笔'],['travel','旅行手记']].map(([v,t])=>`<button data-action="filter-essay" data-value="${v}" class="${essayFilter===v?'active':''}">${t}</button>`).join('')}<div class="search-field"><input id="post-search" type="search" value="${esc(listSearch)}" aria-label="搜索文章" placeholder="搜索文章…"></div></div><div id="essay-results" class="section-spacer">${essayResults()}</div>`;}
function academic(){return `<div class="page-head"><div class="eyebrow">RESEARCH & CURIOSITY</div><h1>学术，也是探索世界的方式。</h1><p>这里承载你的研究、论文与经历。以下为可替换的资料占位，不代表实际学术履历。</p></div><div class="profile-layout"><aside class="profile-sidebar"><div class="avatar">名</div><h2>你的名字</h2><p>Your Name · 个人学术主页<br>院系 / 学校 / 研究机构</p><div class="profile-links"><a href="https://scholar.google.com/" target="_blank" rel="noopener noreferrer">Scholar ↗</a><a href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub ↗</a><a href="https://orcid.org/" target="_blank" rel="noopener noreferrer">ORCID ↗</a></div><p style="margin-top:14px;font-size:9px">以上为平台入口，正式版替换为个人链接</p></aside><div><section class="profile-section"><h2>关于我 <span class="muted" style="font:10px var(--sans);margin-left:10px">ABOUT</span></h2><p>在这里用几句话介绍自己：正在研究的问题、求学经历，以及是什么让你保持好奇。可以放中英文双语简介，让来自不同地方的读者认识你。</p><div class="research-tags"><span>研究方向一（待填写）</span><span>研究方向二（待填写）</span><span>研究方向三（待填写）</span></div></section><section class="profile-section"><h2>最近动态 <span class="muted" style="font:10px var(--sans);margin-left:10px">NEWS</span></h2><div class="placeholder-card"><strong>等待你的第一条学术动态</strong>论文录用、会议报告、项目进展，都可以在正式版后台按日期发布。</div></section><section class="profile-section"><h2>代表论文 <span class="muted" style="font:10px var(--sans);margin-left:10px">SELECTED PUBLICATIONS</span></h2><div class="placeholder-card"><strong>论文标题 / Publication title</strong>作者列表 · 期刊或会议 · 年份<br>预留 Paper、Code、Project 与 BibTeX 链接字段。</div></section><section class="profile-section"><h2>教育与经历 <span class="muted" style="font:10px var(--sans);margin-left:10px">EXPERIENCE</span></h2><p>年份 — 年份 &nbsp; 学位 / 职位 · 机构（待填写）<br>在正式版中，通过后台新增条目并调整展示顺序。</p></section><a class="text-link" href="#/plan">查看资料后台的实现方案 ↗</a></div></div>`;}
function links(){const cards=[['学','Google Scholar','寻找论文，也寻找下一次灵感。','https://scholar.google.com/'],['码','GitHub','代码、项目与开放的想法。','https://github.com/'],['读','arXiv','新问题与新知识的起点。','https://arxiv.org/'],['记','你的朋友的博客','为朋友的文字留一个位置。',null],['窗','常读的网站','收藏一个值得反复打开的页面。',null],['远','下一个好去处','网络世界里的路，也可以慢慢走。',null]];return `<div class="page-head"><div class="eyebrow">A SMALL CORNER OF THE INTERNET</div><h1>一些，值得停留的地方。</h1><p>收藏常用的学术入口，也给朋友的博客留一扇窗。下面的友链为示例位置，正式版可在后台添加、排序或隐藏。</p></div><div class="friend-grid">${cards.map(([icon,title,description,url])=>`${url?`<a href="${url}" target="_blank" rel="noopener noreferrer"`:'<div'} class="friend-card"><span class="friend-icon">${icon}</span><div><h3>${title}</h3><p>${description}</p><span class="external">${url?new URL(url).hostname+' ↗':'待添加链接 · 占位'}</span></div>${url?'</a>':'</div>'}`).join('')}</div><div class="plan-banner"><p class="muted" style="font-size:12px">友链字段：站点名称、网址、简介、图标、分组与排序。正式上线后，全部在可视化后台维护。</p><a class="text-link" href="#/plan">查看完整实现方案 ↗</a></div>`;}

function login(){return `<section class="login-card"><div class="brand-mark">山</div><div class="eyebrow">YOUR WRITING ROOM</div><h1>欢迎回到，写作的地方。</h1><p>选一个地方，写一段故事，<br>把照片和记忆一起留在这里。</p><div class="notice" style="text-align:left">当前为交互演示：无需账号。内容仅保存在当前浏览器，不会同步到云端。正式版使用真实管理员登录。</div><button class="button" data-action="demo-login">进入演示后台 ↗</button><p class="login-foot">演示会话 · 不采集账号或密码</p></section>`;}
function adminLayout(content,page='posts'){return `<section class="admin-shell"><aside class="admin-sidebar"><div class="admin-brand">写作间</div><a class="${page==='posts'?'active':''}" href="#/admin">▤ &nbsp; 文章管理</a><a class="${page==='new'?'active':''}" href="#/admin/new">＋ &nbsp; 写新文章</a><a class="${page==='maps'?'active':''}" href="#/admin/maps">◇ &nbsp; 足迹与着色</a><a class="${page==='backup'?'active':''}" href="#/admin/backup">↓ &nbsp; 数据备份</a><a href="#/">↗ &nbsp; 查看博客</a><div class="admin-bottom">演示模式 · 本机保存<br><button data-action="logout" style="padding:4px 0;font-size:10px">退出会话 ↗</button></div></aside><div class="admin-main">${content}</div></section>`;}
function adminHome(){const posts=[...state.posts].sort((a,b)=>b.date.localeCompare(a.date));return adminLayout(`<div class="admin-heading"><div><h1>你的文字，都在这里。</h1><p>慢慢写，慢慢记录。</p></div><a href="#/admin/new" class="button small">＋ 写新文章</a></div><div class="notice">原型后台 · 本浏览器中的发布仅更新此原型，支持导出备份。正式版将接入账号与云端存储。</div><div class="stats-grid"><div class="stat-box"><span>已发布文章</span><strong>${publishedPosts(state).length}</strong></div><div class="stat-box"><span>草稿箱</span><strong>${state.posts.filter(p=>p.status==='draft').length}</strong></div><div class="stat-box"><span>已到访地区</span><strong>${visitStats(state).been}</strong></div></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>文章标题</th><th>分类 / 地区</th><th>状态</th><th>操作</th></tr></thead><tbody>${posts.map(p=>`<tr><td><a href="#/admin/edit/${encodeURIComponent(p.id)}">${esc(p.title)}</a><br><small class="muted">${esc(p.date)}</small></td><td>${p.type==='travel'?'旅行':'随笔'}${p.regions.length?' · '+p.regions.map(id=>esc(regionById(id)?.name||'')).join(' / '):''}</td><td><span class="status-pill">${p.status==='draft'?'草稿':'已发布'}</span></td><td><a href="#/admin/edit/${encodeURIComponent(p.id)}">编辑 ↗</a></td></tr>`).join('')}</tbody></table></div>`);}
function editorPage(id,regionId){const post=id?state.posts.find(p=>p.id===id):null;if(id&&!post)return notFound();editorAttachments=(post?.body||[]).filter(b=>b.type==='image').map(b=>({...b}));const selected=post?.regions||[regionId].filter(Boolean);return adminLayout(`<div class="admin-heading"><div><h1>${post?'编辑这篇记忆。':'写下，一段新的故事。'}</h1><p>文章可关联一个或多个地区，发布后会出现在对应地区页面。</p></div><a class="text-link" href="#/admin">返回文章列表</a></div><form id="post-form" data-id="${esc(id||'')}"><div class="form-grid"><div><label class="field"><span>文章标题 *</span><input class="title-input" name="title" maxlength="140" placeholder="给这段记忆起个名字…" value="${esc(post?.title||'')}" required></label><label class="field"><span>摘要</span><textarea name="excerpt" maxlength="300" placeholder="用一两句话，留住这篇文章的开头。">${esc(post?.excerpt||'')}</textarea></label><label class="field"><span>正文 *</span></label><div class="editor-frame"><div class="editor-toolbar" aria-label="文字格式"><button type="button" data-command="bold" title="加粗"><b>B</b></button><button type="button" data-command="italic" title="斜体"><i>I</i></button><button type="button" data-command="formatBlock" data-argument="h2" title="二级标题">H2</button><button type="button" data-command="formatBlock" data-argument="p">正文</button><button type="button" data-command="formatBlock" data-argument="blockquote">引用</button><button type="button" data-action="add-link">超链接 ↗</button></div><div class="rich-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="文章正文" id="rich-editor">${post?renderBody(post.body.filter(b=>b.type!=='image')):''}</div></div></div><aside class="editor-side"><h3>文章设置</h3><label class="field"><span>文章类型</span><select name="type"><option value="travel" ${post?.type==='essay'?'':'selected'}>旅行手记</option><option value="essay" ${post?.type==='essay'?'selected':''}>日常随笔</option></select></label><label class="field"><span>日期</span><input type="date" name="date" value="${esc(post?.date||new Date().toLocaleDateString('sv-SE'))}" required></label><div class="field travel-region-field"><span>关联地区（旅行手记必选）</span><input class="region-picker-search" id="picker-search" placeholder="搜索地区…" aria-label="筛选关联地区"><div class="region-picker">${regions.map(r=>`<label data-picker-name="${r.full}"><input type="checkbox" name="regions" value="${r.id}" ${selected.includes(r.id)?'checked':''}>${countryName(r.country)} · ${r.full}</label>`).join('')}</div><div class="selected-regions" id="selected-regions">已选择 ${selected.length} 个地区</div></div><div class="field photos-field"><span>上传照片</span><label class="upload-zone"><span>＋</span>选择照片，附在正文之后<input type="file" id="photo-upload" accept="image/jpeg,image/png,image/webp" multiple aria-label="上传文章照片"></label><p class="muted" style="font-size:9px;margin-top:6px">最多 8 张，每张 ≤ 8 MB；原型自动压缩，首张作为封面。</p><div class="attachments" id="attachments">${attachmentsHTML()}</div></div></aside></div><div class="editor-footer"><small id="save-hint">${post?'已加载本机保存的文章':'尚未保存 · 离开前请保存草稿'}</small><div><button class="button secondary" type="submit" name="intent" value="draft">保存草稿</button><button class="button" type="submit" name="intent" value="published">${post?.status==='published'?'更新发布':'发布文章'} ↗</button></div></div></form>`,'new');}
function attachmentsHTML(){return editorAttachments.map((a,i)=>`<div class="attachment"><img src="${esc(safeImage(a.src))}" alt="${esc(a.alt||'待上传照片')}"><button type="button" data-action="remove-photo" data-index="${i}" aria-label="移除第 ${i+1} 张照片">×</button></div>`).join('');}
function adminMaps(){return adminLayout(`<div class="admin-heading"><div><h1>给足迹，一点颜色。</h1><p>每个地区独立保存状态与自定义颜色，修改后立即更新地图。</p></div><div class="search-field"><input id="admin-region-search" type="search" placeholder="搜索地区…" aria-label="搜索要编辑的地区"></div></div><div class="notice">状态影响已到访统计；右侧色块可自定义该地区的颜色。“默认”恢复该状态的配色。</div><div class="map-admin-list">${regions.map(r=>`<div class="map-admin-row" data-region-row="${r.full}"><a class="region-name" href="#/region/${r.id}">${r.name}</a><small class="muted">${r.country.toUpperCase()}</small><select class="status-select" data-status-id="${r.id}" aria-label="${r.name}足迹状态">${Object.entries(STATUS).map(([key,s])=>`<option value="${key}" ${(state.visits[r.id]||'none')===key?'selected':''}>${s.label}</option>`).join('')}</select><input class="color-input" type="color" value="${colorFor(r.id)}" data-color-id="${r.id}" aria-label="${r.name}自定义颜色"><button class="reset-color" data-action="reset-color" data-id="${r.id}">默认</button></div>`).join('')}</div>`,'maps');}
function backupPage(){return adminLayout(`<div class="admin-heading"><div><h1>给记忆，留一份备份。</h1><p>将文章、照片与地图状态一起带走。</p></div></div><div class="notice">浏览器数据可能在清理缓存后丢失。此原型提供 JSON 导入与导出；正式版使用数据库、对象存储和定期备份。</div><div class="backup-actions"><button class="button" data-action="export">导出完整备份 ↓</button><label class="button secondary" style="cursor:pointer">导入备份 ↑<input type="file" id="import-backup" accept="application/json,.json" hidden></label></div><p class="muted" style="font-size:12px;line-height:2">导出文件包含 ${state.posts.length} 篇文章，以及 ${Object.keys(state.visits).length} 条足迹状态。<br>导入前会先展示内容数量，确认后才替换当前浏览器的数据。</p><div class="placeholder-card" style="margin-top:30px"><strong>从原型到正式网站</strong>当前数据格式可作为正式版内容迁移的输入。正式版媒体库会保留原图、生成缩略图并支持填写照片说明。</div>`,'backup');}

function planPage(){return `<div class="page-head"><div class="eyebrow">FROM PROTOTYPE TO A PERSONAL HOME</div><h1>让它，真正成为你的博客。</h1><p>原型已经展示了地图、文章与编辑流程。下面是兼顾可维护性与写作体验的正式落地方案。</p></div><div class="plan-content"><div class="plan-banner"><p><strong>推荐：Next.js + Payload CMS + PostgreSQL + S3 兼容存储。</strong><br>一个项目承载前台与后台；你在浏览器中管理文章、照片、学术资料和足迹，无需编辑代码。</p></div><h2>内容与路由</h2><table class="plan-table"><thead><tr><th>页面</th><th>正式路由</th><th>内容来源</th></tr></thead><tbody><tr><td>个人首页</td><td>/</td><td>个人简介、最近文章、地图概览</td></tr><tr><td>学术主页</td><td>/academic</td><td>研究方向、论文、动态、经历与简历</td></tr><tr><td>中日双地图</td><td>/travel</td><td>81 个地区、足迹状态、自定义颜色</td></tr><tr><td>地区游记</td><td>/travel/cn/zhejiang 等</td><td>关联该地区的已发布文章</td></tr><tr><td>随笔与文章</td><td>/essays · /posts/[slug]</td><td>文章分类、标签、搜索、正文与照片</td></tr><tr><td>友情链接</td><td>/links</td><td>网站名称、网址、简介、分组与排序</td></tr><tr><td>可视化后台</td><td>/admin</td><td>管理员登录、富文本、媒体库、草稿与预览</td></tr></tbody></table><h2>为什么这样搭</h2><ul><li><strong>Payload CMS：</strong>内置管理员登录与 Lexical 富文本，支持图片上传、草稿、版本记录和文章预览，学术资料也能一起维护。</li><li><strong>SVG 拼图地图：</strong>每个地区绑定永久 ID；颜色来自数据库，点击按 ID 查文章。无需商业地图 API，可自由设计拼图样式。</li><li><strong>PostgreSQL + S3：</strong>文字、关系与状态存数据库；照片存对象存储。用缓存与增量更新减少重复查询。</li><li><strong>部署：</strong>采用支持 Next.js 与 Payload 的 Node 环境，如托管平台或 Docker VPS；数据库可用托管 PostgreSQL，照片可用 R2/S3。</li></ul><h2>内容模型</h2><table class="plan-table"><thead><tr><th>集合</th><th>关键字段</th></tr></thead><tbody><tr><td>users</td><td>管理员账号、角色、登录会话</td></tr><tr><td>regions</td><td>稳定地区 ID、国家、名称、slug、状态、自定义颜色</td></tr><tr><td>posts</td><td>标题、slug、分类、摘要、富文本、封面、多地区关联、发布日期、发布状态</td></tr><tr><td>media</td><td>文件、缩略图、alt、说明、拍摄日期（可选）</td></tr><tr><td>academic / profile</td><td>双语简介、机构、研究、论文、教育、动态、社交与 CV</td></tr><tr><td>links</td><td>标题、URL、描述、图标、分组、顺序、是否展示</td></tr></tbody></table><h2>地图规则</h2><p>中国 34 个省级地区、日本 47 个都道府县在同页展示。默认用“未踏足 / 想去 / 路过 / 到访 / 居住”五级状态配色，每块拼图也可覆盖为任意颜色。“已到访”只统计到访和居住，文章数量独立计算。地区与文章为多对多关系，一篇跨地区旅行可同时出现在多个地区。</p><p style="margin-top:12px">当前使用原创示意拼图，标注了非真实边界与面积。正式版保留同样的卡通拼图风格，完善地区相邻关系、标签和移动端放大操作；如果改用地理轮廓，需单独选定来源与许可并校核数据。</p><h2>从这里开始上线</h2><div class="plan-steps"><div class="plan-step"><span>01</span><h3>确认你的内容</h3><p>替换姓名、头像、学术信息与真实足迹，确认视觉方向和域名。</p></div><div class="plan-step"><span>02</span><h3>接通真实后台</h3><p>初始化 Payload 数据模型、登录权限、富文本与媒体存储，再迁移原型数据。</p></div><div class="plan-step"><span>03</span><h3>发布与维护</h3><p>配置域名与 HTTPS、搜索引擎元数据和 sitemap，完成移动端检查与备份恢复验证。</p></div></div><h2>原型与正式版的边界</h2><p>本原型已实现：双地图、81 个地区的着色与检索、地区文章页、文章阅读与筛选、浏览器富文本编辑、图片上传、草稿与发布，以及 JSON 备份。演示后台不验证账号，文章和照片只在本浏览器保存，不会同步给其他访客。真实鉴权、云端存储、学术与友链的后台编辑、SEO 和域名部署属于下一阶段。</p><p style="margin-top:12px">粗略工作量：熟悉该技术栈的开发者约 7–12 个工作日完成首版与上线验证，取决于内容迁移与设计调整；基础托管常见预算约每月 10–30 美元，域名另计，具体以服务商当前套餐为准。</p><a href="#/admin" class="button" style="margin-top:25px">先体验一下写作 ↗</a></div>`;}
function notFound(){return '<div class="empty-state" style="margin-top:50px"><h3>这一页，还没有写下故事。</h3><p>文章可能尚未发布，或链接已发生变化。</p><a class="button" href="#/">回到首页</a></div>';}
let currentRoute='';
function render(){tooltip.hidden=true;const raw=location.hash.slice(1)||'/';const [path,query='']=raw.split('?');const parts=path.split('/').filter(Boolean).map(s=>{try{return decodeURIComponent(s);}catch{return s;}});const page=parts[0]||'home';
 if(editorDirty&&currentRoute!==raw){dialog.innerHTML='<h2>把这一段文字留下来？</h2><p>当前文章有未保存的修改。选择继续编辑并保存草稿，或离开本页。</p><div class="dialog-actions"><button class="button secondary" data-action="leave-editor" data-target="'+esc(raw)+'">离开本页</button><button class="button" data-action="stay-editor">继续编辑</button></div>';history.replaceState(null,'','#'+currentRoute);dialog.showModal();return;}
 currentRoute=raw;const params=new URLSearchParams(query);let html,title='山海之间';
 if(page==='home'){html=home();title='山海之间 · 学术、旅行与日常';}
 else if(page==='atlas'){html=atlasPage();title='旅行地图 · 山海之间';}
 else if(page==='region'){html=regionPage(parts[1]);title=(regionById(parts[1])?.name||'地区')+' · 山海之间';}
 else if(page==='post'){html=articlePage(parts[1]);title=(state.posts.find(p=>p.id===parts[1])?.title||'文章')+' · 山海之间';}
 else if(page==='preview'){html=articlePage(parts[1],true);title='草稿预览 · 山海之间';}
 else if(page==='academic'){html=academic();title='学术主页 · 山海之间';}
 else if(page==='essays'){html=essays();title='随笔 · 山海之间';}
 else if(page==='links'){html=links();title='友情链接 · 山海之间';}
 else if(page==='plan'){html=planPage();title='实现方案 · 山海之间';}
 else if(page==='admin'){title='写作后台 · 山海之间';if(!session)html=login();else if(parts[1]==='new')html=editorPage(null,params.get('region'));else if(parts[1]==='edit')html=editorPage(parts[2]);else if(parts[1]==='maps')html=adminMaps();else if(parts[1]==='backup')html=backupPage();else html=adminHome();}
 else html=notFound();
 main.innerHTML=html;document.title=title;document.querySelectorAll('[data-nav]').forEach(a=>{const active=a.dataset.nav===page||(page==='region'&&a.dataset.nav==='atlas')||(page==='post'&&a.dataset.nav==='essays');a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});document.querySelector('nav').classList.remove('open');document.querySelector('.menu-toggle').setAttribute('aria-expanded','false');window.scrollTo(0,0);}

function showStatusDialog(id){const r=regionById(id);dialog.innerHTML=`<h2>为${r.name}留下一块颜色。</h2><p>状态用于足迹统计；也可以单独自定义颜色。</p><form id="status-form" data-id="${id}"><div class="status-options">${Object.entries(STATUS).map(([key,s])=>`<label><input type="radio" name="status" value="${key}" ${(state.visits[id]||'none')===key?'checked':''}><i class="swatch" style="background:${s.color}"></i>${s.label}</label>`).join('')}</div><label class="field" style="margin-top:20px"><span>自定义颜色（可选）</span><input name="color" type="color" value="${colorFor(id)}" style="height:40px"></label><label style="font-size:11px;color:#8a9b78"><input type="checkbox" name="custom" ${state.colors[id]?'checked':''}> 使用自定义颜色</label><div class="dialog-actions"><button type="button" class="button secondary" data-action="close-dialog">取消</button><button class="button" type="submit">保存足迹</button></div></form>`;dialog.showModal();}
function ensureSession(target){if(session){go(target);return;}try{sessionStorage.setItem('fieldnotes-return',target);}catch{}go('/admin');toast('先进入演示后台，即可写作或编辑足迹');}
document.querySelector('.menu-toggle').addEventListener('click',e=>{const open=document.querySelector('nav').classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',open);});
document.addEventListener('click',e=>{const region=e.target.closest('[data-region]');if(region&&!region.closest('.mini-map')){go('/region/'+region.dataset.region);return;}
 const command=e.target.closest('[data-command]');if(command){e.preventDefault();document.execCommand(command.dataset.command,false,command.dataset.argument||null);document.querySelector('#rich-editor').focus();editorDirty=true;return;}
 const b=e.target.closest('[data-action]');if(!b)return;const {action,id,value}=b.dataset;
 if(action==='filter-map'){mapFilter=value;const y=window.scrollY;main.querySelector('.atlas-section').outerHTML=atlasSection(location.hash.startsWith('#/atlas'));window.scrollTo(0,y);}
 else if(action==='filter-essay'){essayFilter=value;main.querySelectorAll('[data-action="filter-essay"]').forEach(el=>el.classList.toggle('active',el.dataset.value===value));document.querySelector('#essay-results').innerHTML=essayResults();}
 else if(action==='demo-login'){session=true;let target=currentRoute.startsWith('/admin/')?currentRoute:'/admin';try{sessionStorage.setItem('fieldnotes-demo-session','1');target=sessionStorage.getItem('fieldnotes-return')||target;sessionStorage.removeItem('fieldnotes-return');}catch{}if(target===currentRoute)render();else go(target);toast('已进入演示后台 · 修改保存在本浏览器');}
 else if(action==='logout'){session=false;try{sessionStorage.removeItem('fieldnotes-demo-session');}catch{}go('/admin');render();}
 else if(action==='new-region-post')ensureSession('/admin/new?region='+id);
 else if(action==='edit-status'){if(session)showStatusDialog(id);else ensureSession('/admin/maps');}
 else if(action==='reset-color'){delete state.colors[id];if(persist()){document.querySelector(`[data-color-id="${id}"]`).value=colorFor(id);toast('已恢复状态默认颜色');}}
 else if(action==='close-dialog')dialog.close();
 else if(action==='remove-photo'){editorAttachments.splice(Number(b.dataset.index),1);document.querySelector('#attachments').innerHTML=attachmentsHTML();editorDirty=true;}
 else if(action==='export'){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),version:1},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fieldnotes-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('备份已导出，包含文章、照片和足迹');}
 else if(action==='add-link'){const input=prompt('请输入完整链接（https://…）');if(input){const url=safeURL(input);if(url){document.execCommand('createLink',false,url);editorDirty=true;}else toast('请输入有效的 http、https 或邮件链接');}}
 else if(action==='leave-editor'){editorDirty=false;dialog.close();go(b.dataset.target);}
 else if(action==='stay-editor')dialog.close();
});
document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-command], [data-action="add-link"]'))e.preventDefault();});
document.addEventListener('keydown',e=>{const r=e.target.closest('[data-region]');if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go('/region/'+r.dataset.region);}});
function displayTooltip(el,x,y){const r=regionById(el.dataset.region);tooltip.innerHTML=`<strong>${r.full}</strong><small>${statusFor(r.id).label} · ${regionPosts(state,r.id).length} 篇游记 · 点击进入 ↗</small>`;tooltip.hidden=false;tooltip.style.left=Math.min(x+12,window.innerWidth-220)+'px';tooltip.style.top=Math.min(y+15,window.innerHeight-85)+'px';}

document.addEventListener('change',async e=>{const t=e.target;if(t.id==='show-labels'){document.querySelectorAll('.map-canvas').forEach(el=>el.classList.toggle('hide-labels',!t.checked));}
 else if(t.dataset.statusId){state.visits[t.dataset.statusId]=t.value;if(persist()){document.querySelector(`[data-color-id="${t.dataset.statusId}"]`).value=colorFor(t.dataset.statusId);toast('足迹已保存');}}
 else if(t.name==='regions'){document.querySelector('#selected-regions').textContent='已选择 '+document.querySelectorAll('[name="regions"]:checked').length+' 个地区';}
 else if(t.name==='type'){document.querySelector('.travel-region-field').style.opacity=t.value==='essay'?'.6':'1';}
 else if(t.id==='photo-upload'){await handlePhotos(t.files);t.value='';}
 else if(t.id==='import-backup'){try{if(t.files[0].size>15*1024*1024)throw new Error('文件过大');const data=JSON.parse(await t.files[0].text());if(!validateImport(data))throw new Error('格式无效');dialog.innerHTML=`<h2>导入这份备份？</h2><p>将以备份中的 ${data.posts.length} 篇文章与 ${Object.keys(data.visits).length} 条足迹替换本浏览器的数据。建议先导出当前备份。</p><div class="dialog-actions"><button class="button secondary" data-action="close-dialog">取消</button><button class="button" id="confirm-import">确认导入</button></div>`;dialog.querySelector('#confirm-import').onclick=()=>{const before=state;state={visits:data.visits,colors:data.colors||{},posts:data.posts};if(persist()){dialog.close();render();toast('备份已导入');}else state=before;};dialog.showModal();}catch{toast('备份无效：请使用本原型导出的 JSON 文件');}t.value='';}

async function handlePhotos(files){for(const file of files){if(editorAttachments.length>=8){toast('最多添加 8 张照片');break;}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('请选择 JPG、PNG 或 WebP 照片');continue;}if(file.size>8*1024*1024){toast('每张照片不能超过 8 MB');continue;}try{const src=await compressPhoto(file);editorAttachments.push({type:'image',src,alt:file.name.replace(/\.[^.]+$/,'')});}catch{toast('有一张照片无法读取，请换一张试试');}}document.querySelector('#attachments').innerHTML=attachmentsHTML();editorDirty=true;}
function compressPhoto(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const scale=Math.min(1,1400/img.width,1400/img.height),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.78));};img.onerror=()=>{URL.revokeObjectURL(url);reject();};img.src=url;});}
function extractEditor(){const editor=document.querySelector('#rich-editor');return [...editor.childNodes].map(node=>{if(node.nodeType===Node.TEXT_NODE)return node.textContent.trim()?{type:'p',text:node.textContent}:null;const tag=node.tagName?.toLowerCase();return {type:tag==='h2'?'h2':tag==='blockquote'?'quote':'p',html:sanitizeInline(node.innerHTML||''),text:node.textContent||''};}).filter(b=>b&&(b.text.trim()||b.html?.includes('<br>')));}
